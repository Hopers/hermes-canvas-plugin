<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Anton'; src: url(data:font/woff2;base64,ANTON_B64) format('woff2'); font-display: swap; }
  :root {
    --accent: #e10600; --ok: #2fbf71;
  }
  [data-theme="dark"], :root { --bg: #0a0a0a; --fg: #f7f5f0; --mut: #8a857c; --hair: rgba(128,124,116,.35); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: 'Anton', ui-sans-serif, sans-serif;
    transition: background .45s ease, color .45s ease;
    overflow: hidden;
  }

  .frame { height: 100%; display: grid; grid-template-rows: auto auto 1fr auto auto auto; padding: 18px 24px 12px; }

  /* ── hero ────────────────────────────── */
  .hero { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; min-width: 0; }
  .hero h1 {
    font-size: clamp(30px, 8vw, 72px); line-height: .9; letter-spacing: -.01em;
    text-transform: uppercase; user-select: none; min-width: 0;
  }
  .hero h1 .thin { color: inherit; opacity: .55; }
  .hero-right { display: flex; flex-direction: column; align-items: flex-end; gap: 7px; flex-shrink: 0; }
  .issue { font-size: 9px; letter-spacing: .26em; text-transform: uppercase; color: var(--mut); font-family: ui-monospace, monospace; white-space: nowrap; }

  /* ── 横向索引条 ─────────────────────── */
  .index-row {
    display: flex; gap: 4px; border-top: 1px solid var(--fg); border-bottom: 1px solid var(--hair);
    margin-top: 11px; padding: 8px 0; font-family: ui-monospace, monospace;
    font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: var(--mut);
    overflow-x: auto; scrollbar-width: none;
  }
  .index-row::-webkit-scrollbar { display: none; }
  .index-row span { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
  .index-row span::after { content: "/"; color: var(--hair); margin-left: 12px; }
  .index-row span:last-child::after { content: none; }
  .index-row .on { color: var(--fg); }
  .index-row .on::before { content: ""; width: 10px; height: 1px; background: var(--accent); }

  /* ── 画布（tldraw 挂载点）──────────── */
  .canvas-wrap { position: relative; min-height: 0; display: flex; flex-direction: column; padding: 12px 0 6px; }
  #canvas { flex: 1; min-height: 0; position: relative; overflow: hidden; }
  .fig-line { display: flex; align-items: center; gap: 12px; padding-top: 7px; font-family: ui-monospace, monospace; font-size: 9px; letter-spacing: .3em; color: var(--mut); text-transform: uppercase; }
  .fig-line::before { content: ""; width: 28px; height: 1px; background: var(--fg); flex-shrink: 0; }
  #fig-shapes { color: var(--fg); }

  /* ── 状态条 ─────────────────────────── */
  #status {
    font-family: ui-monospace, monospace; font-size: 10px; letter-spacing: .12em; line-height: 1.7;
    padding: 6px 0 7px; white-space: pre-wrap; color: var(--mut);
    border-bottom: 1px solid var(--hair); min-height: 28px;
  }
  #status.fail { color: var(--accent); }

  /* ── 工具行 ─────────────────────────── */
  .tools-row { display: grid; grid-template-columns: repeat(4, 1fr) auto; gap: 8px; border-top: 1px solid var(--fg); padding-top: 11px; }
  .tool {
    background: none; border: 1px solid var(--hair); color: var(--fg); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px 8px;
    position: relative; transition: border-color .25s; font-family: 'Anton', ui-sans-serif, sans-serif;
  }
  .tool svg { width: 17px; height: 17px; stroke-width: 1.5; }
  .tool span { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
  .tool::after { content: ""; position: absolute; left: 0; bottom: -1px; height: 2px; width: 0; background: var(--accent); transition: width .35s cubic-bezier(.22,1,.36,1); }
  .tool:hover { border-color: var(--fg); }
  .tool:hover::after { width: 100%; }
  .tool:hover svg { color: var(--accent); }
  .tool:disabled { opacity: .35; cursor: default; }
  .tool:disabled::after { width: 0 !important; }
  .tool.cta {
    border: 1px solid var(--fg); background: var(--fg); color: var(--bg); min-width: 104px;
    transition: background .25s, color .25s, border-color .25s;
  }
  .tool.cta:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tool.cta:hover::after { width: 0; }
  .tool.cta:disabled { opacity: .35; }

  /* ── 状态行 ─────────────────────────── */
  .foot { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 10px; margin-top: 10px; font-family: ui-monospace, monospace; font-size: 9px; letter-spacing: .16em; color: var(--mut); }
  .foot .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); margin-right: 7px; vertical-align: 1px; }
  .foot .l { display: flex; align-items: center; white-space: nowrap; }

  @media (max-width: 480px) {
    .hero-right .issue:first-child { display: none; }
    .hero h1 .thin { display: block; opacity: .55; }
    .foot span:nth-child(2) { display: none; }
  }
</style>
</head>
<body>
<div class="frame">
  <header class="hero">
    <h1>Atelier<span class="thin">—Canvas</span></h1>
    <div class="hero-right">
      <span class="issue">N°01 — 无限画布</span>
      <span class="issue">HERMES ATELIER / LOCAL</span>
    </div>
  </header>

  <nav class="index-row">
    <span class="on">01 圈选批注</span>
    <span>02 移动对</span>
    <span>03 AI 图框</span>
    <span>04 回传返修</span>
  </nav>

  <section class="canvas-wrap">
    <div id="canvas"></div>
    <div class="fig-line"><span id="fig-shapes">FIG. 01</span><span>反复推敲</span></div>
  </section>

  <div id="status">INIT — 正在初始化画布引擎（本地 bundle，无网络请求）…</div>

  <div class="tools-row">
    <button class="tool" id="addpair" disabled title="A→B 移动对：把A区域内容移到B并缩放"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/><circle cx="12" cy="12" r="1"/></svg><span>移动对</span></button>
    <button class="tool" id="addslot" disabled title="AI 图框：框内写描述，按框生成新图"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.8a2 2 0 0 0 1.3 1.3L21 12l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-1.9a2 2 0 0 0 1.3-1.3L12 3z"/></svg><span>AI 图框</span></button>
    <button class="tool" id="wipe" disabled title="清除全部标注（保留图片）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14z"/></svg><span>清除</span></button>
    <button class="tool" id="clear-canvas" disabled title="清空画布（含图片，恢复初始）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H8.5l-4.2-4.2a2 2 0 0 1 0-2.8L13 4.3a2 2 0 0 1 2.8 0l4 4a2 2 0 0 1 0 2.8L13.5 17.3"/><path d="M6 11l7 7"/></svg><span>重置</span></button>
    <button class="tool cta" id="send" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg><span>回传画布</span></button>
  </div>

  <footer class="foot">
    <span class="l"><span class="dot"></span>LOCAL ENGINE</span>
    <span>0 EXTERNAL REQUESTS</span>
    <span id="clock"></span>
  </footer>
</div>
<script src="./entry.jsx"></script>
</body>
</html>
