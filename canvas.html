<style>
  .wrap { font: 13px/1.6 ui-monospace, monospace; color: var(--foreground, #e8eaee); max-width: 760px; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
  .bar b { font-size: 14px; }
  button {
    background: var(--accent, #4f8cff); color: #fff; border: 0; border-radius: 6px;
    padding: 6px 14px; font: 13px ui-monospace, monospace; cursor: pointer;
  }
  button.ghost { background: var(--card, #2a2d37); color: var(--foreground, #e8eaee); border: 1px solid var(--border, #3a3d47); }
  button:disabled { opacity: .45; cursor: default; }
  #status {
    background: var(--card, #1b1d24); border: 1px solid var(--border, #2a2d37);
    border-radius: 8px; padding: 8px 12px; white-space: pre-wrap; margin: 6px 0; font-size: 12px;
  }
  #status.fail { color: #f38ba8; }
  #canvas { height: 460px; border: 1px solid var(--border, #2a2d37); border-radius: 8px; overflow: hidden; position: relative; }
  .hint { color: var(--muted-foreground, #8b8f9a); font-size: 12px; margin-top: 6px; }
</style>

          if (s.type === 'image' && s.props) lite.img = { ax: Math.round(s.x), ay: Math.round(s.y), w: s.props.w, h: s.props.h };
          if (s.type === 'draw' && s.props && s.props.segments) lite.seg = s.props.segments.map(function (g) { return [Math.round(g.x), Math.round(g.y)]; });
          if (s.type === 'arrow' && s.props) { lite.s = s.props.start && [Math.round(s.props.start.x), Math.round(s.props.start.y)]; lite.e = s.props.end && [Math.round(s.props.end.x), Math.round(s.props.end.y)]; }
          if ((s.type === 'text' || s.type === 'note') && s.props) {
            var txt = [];
            (function walk(n) { (n || []).forEach(function (c) { if (c.text) txt.push(c.text); if (c.content) walk(c.content); }); })(s.props.richText && (s.props.richText.content || [s.props.richText]));
            lite.tx = txt.join(' ');
          }
          if (s.type === 'geo' && s.props) { lite.g = s.props.geo; lite.w = Math.round(s.props.w || 0); lite.h = Math.round(s.props.h || 0); }
          return lite;
        })
      };
    });
  };

  var tiptapText = function (rt) {
    var out = '';
    var walk = function (n) {
      if (!n) return;
      if (n.type === 'text' && typeof n.text === 'string') out += n.text;
      if (n.content) n.content.forEach(walk);
    };
    walk(rt);
    return out;
  };

  // 紧凑回传：只发标注要点，规避隐藏消息通道的长度截断
  var buildCompact = function () {
    var all = listShapes();
    var marks = all.filter(function (s) { return s.type !== 'image'; }).map(function (s) {
      var m = { t: s.type, x: Math.round(s.x), y: Math.round(s.y) };
      if (s.props) {
        if (s.props.w) m.w = Math.round(s.props.w);
        if (s.props.h) m.h = Math.round(s.props.h);
        if (s.type === 'text' && s.props.richText) m.text = tiptapText(s.props.richText);
        if (s.props.start && s.props.end) m.d = [Math.round(s.props.start.x), Math.round(s.props.start.y), Math.round(s.props.end.x), Math.round(s.props.end.y)];
        if (s.type === 'draw' && s.props.segments && s.props.segments[0]) {
          m.pts = (s.props.segments[0].points || []).filter(function (_, i) { return i % 3 === 0; }).slice(0, 24).map(function (p) { return [Math.round(p.x), Math.round(p.y)]; });
        }
      }
      return m;
    });
    return { tag: 'CANVAS-V1-C', sentAt: new Date().toISOString(), imgs: all.filter(function (s) { return s.type === 'image'; }).length, marks: marks };
  };

  // hermes.send 通道：prompt 上限 500 字符、每帧每秒 1 条（官方文档）→ 分片 420 字、间隔 1.2s
  var sendChunked = function (text, done) {
    if (text.length <= 460) {
      try { window.hermes.send(text); } catch (e) { st('回传失败: ' + e.message, true); return; }
      done(1);
      return;
    }
    var parts = [];
    for (var i = 0; i < text.length; i += 420) parts.push(text.slice(i, i + 420));
    var idx = 0;
    var next = function () {
      if (idx >= parts.length) { done(parts.length); return; }
      var header = 'CANVAS-V1-C#' + (idx + 1) + '/' + parts.length + ' ';
      try {
        window.hermes.send(header + parts[idx]);
        idx++;
        setTimeout(next, 1200);
      } catch (e) { st('分片 ' + (idx + 1) + ' 回传失败: ' + e.message, true); }
    };
    next();
  };

  document.getElementById('send').onclick = function () {
    if (!editor) return;
    st('序列化标注中…');
    try {
      var p = buildCompact();
      var text = JSON.stringify(p);
      sendChunked(text, function (n) {
        document.getElementById('clock').textContent = '已回传 @ ' + new Date().toLocaleTimeString();
        st('已回传 ✓ ' + p.marks.length + ' 个标注（' + n + ' 片，' + Math.round(text.length / 1024) + 'KB）\nHermes 会基于标注继续处理，稍等它改写本文件。');
      });
    } catch (e) {
      st('序列化异常: ' + (e && e.message), true);
    }
  };

  document.getElementById('wipe').onclick = function () {
    if (!editor) return;
    var ids = listShapes().filter(function (s) { return s.type !== 'image'; }).map(function (s) { return s.id; });
    if (ids.length) editor.deleteShapes(ids);
    st('已清掉 ' + ids.length + ' 个标注形状（图片保留）');
  };

  var src = "export const ready = (async () => {" +
    " const R = await import('https://esm.sh/react@18.3.1');" +
    " const RD = await import('https://esm.sh/react-dom@18.3.1/client');" +
    " const T = await import('https://esm.sh/@tldraw/tldraw@3.13.0?deps=react@18.3.1');" +
    " return { R, RD, T };" +
    "})();";
  st('加载 tldraw（esm.sh，冷启动约 10s）…');
  import(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })))
    .then(function (mod) { return mod.ready; })
    .then(function (m) {
      var React = m.R.default || m.R;
      var T = m.T;
      var onload = function (ed) {
        editor = ed;
        window.__CANVAS_EDITOR__ = ed;  // 调试/自动化入口
        try {
          var init = window.__INITIAL__;
          if (init && init.assets && init.assets.length) {
            ed.createAssets(init.assets);
            ed.createShapes(init.shapes);
            st('画布就绪 ✓ 载入 ' + init.shapes.length + ' 个形状 (' + ((Date.now() - t0) / 1000).toFixed(1) + 's)。\n👉 在图上圈选/画箭头/写字标注 → 点「回传画布」，Hermes 按标注改图。');
          } else {
            st('画布就绪 ✓ 空白 (' + ((Date.now() - t0) / 1000).toFixed(1) + 's)。\n可自由涂画/贴图，或让 Hermes 生成图片。');
          }
        } catch (e) {
          st('初始状态载入出错: ' + e.message + '（画布本身可用）', true);
        }
        document.getElementById('send').disabled = false;
        document.getElementById('wipe').disabled = false;
      };
      m.RD.createRoot(document.getElementById('canvas')).render(
        React.createElement(T.Tldraw, { onMount: onload })
      );
    })
    .catch(function (e) {
      st('加载失败: ' + String((e && e.message) || e).slice(0, 250), true);
    });
})();
</script>
</body>
</html>
